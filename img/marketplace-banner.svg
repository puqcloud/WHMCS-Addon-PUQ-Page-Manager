<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Block Builder/Page Icon -->
  <g transform="translate(170, 25)">
    <!-- Page outline -->
    <rect x="20" y="10" width="120" height="150" rx="8" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <!-- Block 1 (header) -->
    <rect x="34" y="26" width="92" height="20" rx="3" fill="#6c3ce0" opacity="0.6"/>
    <!-- Block 2 (text) -->
    <rect x="34" y="56" width="92" height="12" rx="2" fill="#4a5568" opacity="0.6"/>
    <rect x="34" y="76" width="68" height="12" rx="2" fill="#4a5568" opacity="0.4"/>
    <!-- Block 3 (widget blocks) -->
    <rect x="34" y="100" width="40" height="40" rx="4" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="86" y="100" width="40" height="40" rx="4" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Plus icon in widget block -->
    <line x1="54" y1="112" x2="54" y2="128" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="46" y1="120" x2="62" y2="120" stroke="#8b5cf6" stroke-width="3"/>
  </g>

  <!-- Module Name (Big & Readable) -->
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="white" text-anchor="middle">PAGE</text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="white" text-anchor="middle">MANAGER</text>

  <!-- Subtitle -->
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">WHMCS ADDON</text>

  <!-- Separator -->
  <rect x="180" y="395" width="140" height="4" fill="#6c3ce0" rx="2"/>

  <!-- PUQ Software Branding -->
  <g transform="translate(185, 420)">
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#6c3ce0">PUQ</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Software</text>
  </g>
</svg>
