<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111c38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Top Line Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>

  <!-- Accent Line Top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Ambient Glow Behind Illustration -->
  <circle cx="185" cy="150" r="125" fill="#6c3ce0" opacity="0.18" />
  <circle cx="185" cy="150" r="85" fill="#8b5cf6" opacity="0.16" />

  <!-- LEFT: Page Builder & Widgets Illustration -->
  <g transform="translate(100, 50) scale(1.35)">
    <!-- Page outline -->
    <rect x="20" y="10" width="100" height="130" rx="6" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <!-- Block 1 (header) -->
    <rect x="32" y="24" width="76" height="16" rx="2.5" fill="#6c3ce0" opacity="0.65"/>
    <!-- Block 2 (text lines) -->
    <rect x="32" y="48" width="76" height="8" rx="1.5" fill="#4a5568" opacity="0.6"/>
    <rect x="32" y="62" width="54" height="8" rx="1.5" fill="#4a5568" opacity="0.4"/>
    <!-- Block 3 (widget blocks) -->
    <rect x="32" y="80" width="34" height="34" rx="3.5" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="74" y="80" width="34" height="34" rx="3.5" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Plus icons in widget blocks -->
    <line x1="49" y1="90" x2="49" y2="104" stroke="#8b5cf6" stroke-width="2.5"/>
    <line x1="42" y1="97" x2="56" y2="97" stroke="#8b5cf6" stroke-width="2.5"/>
    <line x1="91" y1="90" x2="91" y2="104" stroke="#8b5cf6" stroke-width="2.5"/>
    <line x1="84" y1="97" x2="98" y2="97" stroke="#8b5cf6" stroke-width="2.5"/>

    <!-- Floating widget tiles -->
    <g transform="translate(115, 75)">
      <rect x="0" y="0" width="16" height="16" rx="2.5" fill="#6c3ce0" opacity="0.5"/>
      <rect x="20" y="0" width="16" height="16" rx="2.5" fill="#8b5cf6" opacity="0.4"/>
      <rect x="0" y="20" width="16" height="16" rx="2.5" fill="#a78bfa" opacity="0.35"/>
      <rect x="20" y="20" width="16" height="16" rx="2.5" fill="#6c3ce0" opacity="0.45"/>
    </g>
  </g>

  <!-- CENTER: Typography & Features -->
  <g transform="translate(360, 0)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b5cf6" letter-spacing="3">WHMCS ADDON MODULE</text>

    <!-- Main Module Title -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="2">PAGE MANAGER</text>

    <!-- Accent Divider -->
    <rect x="0" y="150" width="500" height="4" fill="url(#accent)" rx="2"/>

    <!-- Feature Bullets -->
    <g transform="translate(0, 185)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Visual Block Page Builder (EditorJS) with 24 Built-in Widgets</text>
    </g>
    <g transform="translate(0, 215)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Complete SEO Optimization, Multilingual Support &amp; Page Analytics</text>
    </g>
    <g transform="translate(0, 245)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Password Protection, Revision History &amp; WHMCS Page Rewrites</text>
    </g>
  </g>

  <!-- RIGHT: PUQ Software Brand & Verification Badge -->
  <line x1="940" y1="50" x2="940" y2="250" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <g transform="translate(970, 0)">
    <g transform="translate(95, 95)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#8b5cf6" text-anchor="middle">PUQ</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">SOFTWARE</text>
    </g>
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#111c38" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="24" cy="21" r="9" fill="#6c3ce0"/>
      <polyline points="20,21 23,24 29,18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd" letter-spacing="1">MARKETPLACE</text>
    </g>
  </g>
</svg>
